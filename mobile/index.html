<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Center</title>
    <link rel="stylesheet" href="styles.css?v3">
</head>
<body>
    <div id="container">

        <div class="logo-container">
            <img src="/logo.png" alt="DindeGDPS Logo" class="logo">
        </div>

        <div id="platform" class="step-view">
            <h1>Select Your Platform</h1>
            <div class="button-group">
                <button onclick="select(1)">Android</button>
                <button onclick="select(2)">iOS</button>
            </div>
        </div>

        <div id="version" class="step-view">
            <h1>Select Version</h1>
            <div class="button-group">
                <button onclick="select(19)" id="ioshideable">1.9</button>
                <button onclick="select(20)">2.0</button>
                <button onclick="select(21)">2.1</button>
                <button onclick="select(22)">2.2</button>
            </div>
        </div>

        <div id="finalAndroid" class="step-view">
            <h2>Downloading APK...</h2>
            <div class="button-group" style="margin-top: 16px;">
                <a href="https://github.com/masckmaster2007/moddinde-android/releases/latest" id="geodeLink">
                    <button>Download Geode</button>
                </a>
                <a href="https://link1.pw/19howto" id="gLink">
                    <button id="gBtn">How to Install?</button>
                </a>
            </div>
        </div>

        <div id="finalIOS" class="step-view">
            <h1>Download Options</h1>
            <div class="button-group">
                <a href="https://github.com/masckmaster2007/dindeode-ios/releases/latest" id="geodeLinkDarwin">
                    <button>Geode Launcher</button>
                </a>
                <a href="" id="ipaLink"><button>IPA Download</button></a>
                <a href="" id="directLink"><button>Direct Install</button></a>
            </div>
            <p>Direct Install requires a jailbroken device with <strong>AppSync Unified</strong> installed.<br>IPA Download is strongly recommended.</p>
        </div>
    </div>
    <script src="./script.js?v5"></script>
</body>
</html>
